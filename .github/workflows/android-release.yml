name: Android release (signed AAB/APK)

# Standalone native build — no Expo Go, no EAS cloud. Produces a Play-ready .aab and a sideloadable .apk.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to (leave empty to only build artifacts)
        type: choice
        options: ['', internal, alpha, beta, production]
        default: ''
  push:
    tags: ['mobile-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EZYIFY_UPLOAD_STORE_FILE: ${{ github.workspace }}/apps/mobile/android/app/ezyify-upload.keystore
      EZYIFY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      EZYIFY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      EZYIFY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ezyify/core --filter=@ezyify/tokens

      # `secrets` is not available in step `if:` expressions, so both steps branch on env vars instead.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$EZYIFY_UPLOAD_STORE_FILE"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — release signing is required (see docs/plan/ANDROID_RELEASE.md)"
            exit 1
          fi

      - name: Write google-services.json (FCM)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret missing — using placeholder; push notifications will not work in this build"
            cp google-services.json.example google-services.json
          fi

      - name: Regenerate android/ from app.config.ts
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release AAB + APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: 16 KB page-size alignment check (Play requirement for API 35+)
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          APK=$(ls *.apk | head -1)
          mkdir -p /tmp/apk && unzip -o -q "$APK" 'lib/*' -d /tmp/apk || true
          BAD=0
          for so in $(find /tmp/apk/lib -name '*.so' 2>/dev/null); do
            ALIGN=$(objdump -p "$so" | awk '/LOAD/ && /align/ {print $NF; exit}')
            case "$ALIGN" in 2**14|2**16) ;; *) echo "::error::$so LOAD align=$ALIGN (needs 2**14)"; BAD=1;; esac
          done
          [ "$BAD" = 0 ] && echo "All native libs are 16 KB aligned"
          exit $BAD

      - name: Verify release signature (must not be the debug key)
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls *.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK is signed with the debug keystore — upload key was not applied"; exit 1
          fi
          echo "SHA-256 of the *upload* certificate (Play App Signing shows the separate app-signing cert for assetlinks.json):"
          grep -i 'SHA-256' /tmp/certs.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: ezyify-android-release
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Tags (mobile-v*) go to the internal track automatically; manual runs pick a track. Skips with a
      # warning until the PLAY_SERVICE_ACCOUNT_JSON secret exists (Play Console → Setup → API access).
      - name: Resolve Play track
        id: track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          TRACK="$INPUT_TRACK"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TRACK="${TRACK:-internal}"; fi
          if [ -z "$TRACK" ]; then echo "No track requested — artifacts only"; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON secret missing — skipping upload to '$TRACK' (see docs/plan/ANDROID_RELEASE.md §7)"; exit 0
          fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Google Play
        if: steps.track.outputs.track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ezyify.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.track == 'production' && 'draft' || 'completed' }}
          whatsNewDirectory: apps/mobile/store/whatsnew
          mappingFile: apps/mobile/android/app/build/outputs/mapping/release/mapping.txt
